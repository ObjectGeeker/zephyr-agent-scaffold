# 基础配置
spring:
  application:
    name: zephyr-agent-scaffold-app
  # 引入Agent配置；.env 存放密钥等敏感配置（已被 .gitignore 排除）
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - classpath:agents/single-agent.yml
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:3306/zephyr_agent_scaffold?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 15 #最小空闲连接数量
      idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 25 #连接池最大连接数，默认是10
      auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
      max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource
  profiles:
    active: local
server:
  servlet:
    context-path: /api
  port: 8123

# MyBatis Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线转大小写开启
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: is_delete
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
    sequence:
      worker-id: ${random.int(1,31)}
      datacenter-id: ${random.int(1,31)}

# redis 配置
redis:
  sdk:
    config:
      host: 192.168.1.108
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

#Knife4j
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.object.ai
knife4j:
  enable: false
  setting:
    language: zh_cn
  production: true